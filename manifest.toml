#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cloudlog"
name = "CloudLog"
description.en = "Amateur radio logging application"
description.fr = "Application de journalisation pour radioamateurs"

version = "2.8.21~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://www.cloudlog.co.uk"
code = "https://github.com/magicbug/Cloudlog"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/magicbug/Cloudlog/archive/refs/tags/2.8.21.tar.gz"
    sha256 = "e301fa361e9a2a154464513c2c3ebb140802b306c6179ad4278278f2cb25cf32"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php8.5-curl, php8.5-mbstring, php8.5-mysql, php8.5-xml"

    [resources.database]
    type = "mysql"
